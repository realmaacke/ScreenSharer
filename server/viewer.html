<!doctype html>
<meta charset="utf-8">
<title>Viewer</title>
<style>
  body { margin: 0; padding: 0; background: #000; }
  video { width: 100vw; height: 100vh; object-fit: contain; display: block; }
</style>
<video id="screen" autoplay muted></video>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1/dist/mpegts.js"></script>
<script>
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const player = mpegts.createPlayer(
    {
      type: "mpegts",
      isLive: true,
      url: `${proto}://${location.host}/viewer`,
    },
    {
      enableStashBuffer: false,
      liveBufferLatencyChasing: true,
    }
  );
  player.attachMediaElement(document.getElementById("screen"));
  player.load();
  player.play();
</script>
